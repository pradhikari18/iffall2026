<!DOCTYPE html>
<html>
	<head>
		
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Buttons</title>

		<link href='https://fonts.googleapis.com/css?family=Open+Sans:400,300,300italic,400italic,600,600italic,700,700italic,800,800italic' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Bangers' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=IBM+Plex+Sans:700' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Fredoka:600' rel='stylesheet' type='text/css'>
		<link href='https://fonts.googleapis.com/css?family=Nunito:800' rel='stylesheet' type='text/css'>

		<link href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">
		
		<style>

			body {
				color: #333;
				font-family: 'Open Sans', sans-serif;
				margin: 0;
				padding: 0;
			}

			main {
				margin: 40px;
			}

			h1 {
			 	font-size: 30px;
			 	margin-bottom: 40px;
			}

			.button_container {
				border: 1px solid #ddd;
				margin: 0 10px 10px 0;
				padding: 20px;
				width: 300px;
				height: 300px;
				float: left;
				overflow: hidden;
				box-sizing: border-box;
				text-align: center;
			}



			a#btn_instagram {
				display: inline-block;
				margin: auto;
				margin-top: 95px;
				padding: 16px 34px;
				border-radius: 40px;
				background: linear-gradient(45deg, #feda75, #fa7e1e, #d62976, #962fbf);
				color: #fff;
				font-family: 'Pacifico', cursive;
				font-size: 26px;
				text-decoration: none;
				text-shadow: 0 2px 4px rgba(0,0,0,.3);
				box-shadow: 0 8px 20px rgba(214,41,118,.45);
				transition: all .3s;
			}

			a#btn_instagram i {
				margin-right: 8px;
			}

			a#btn_instagram:hover {
				background: linear-gradient(225deg, #feda75, #fa7e1e, #d62976, #962fbf);
				box-shadow: 0 2px 6px rgba(214,41,118,.45);
			}

			a#btn_cartoon {
				display: inline-block;
				margin: auto;
				margin-top: 90px;
				padding: 14px 28px;
				border: 5px solid #000;
				background-color: #fff;
				color: #000;
				font-family: 'Bangers', sans-serif;
				font-size: 32px;
				letter-spacing: 3px;
				text-decoration: none;
				box-shadow: 8px 8px 0 #000;
				transition: all .2s;
			}

			a#btn_cartoon:hover {
				background-color: #000;
				color: #fff;
				box-shadow: 2px 2px 0 #000;
			}

			a#btn_ibm {
				display: inline-block;
				margin: auto;
				margin-top: 90px;
				padding: 18px 56px;
				background-color: #0f62fe;
				border-bottom: 5px solid #0043ce;
				color: #fff;
				font-family: 'IBM Plex Sans', sans-serif;
				font-weight: bold;
				font-size: 28px;
				letter-spacing: 8px;
				text-decoration: none;
				transition: all .3s;
			}

			a#btn_ibm:hover {
				background-color: #0043ce;
				border-bottom: 5px solid #002d9c;
			}

			a#btn_oldnavy {
				display: inline-block;
				margin: auto;
				margin-top: 90px;
				padding: 20px 36px;
				border: 3px dashed #f2e3b3;
				border-radius: 10px;
				background-color: #003764;
				color: #fff;
				font-family: 'Fredoka', sans-serif;
				font-size: 28px;
				text-decoration: none;
				text-shadow: 0 2px 0 rgba(0,0,0,.4);
				transition: all .3s;
			}

			a#btn_oldnavy i {
				color: #e4002b;
				margin-right: 8px;
			}

			a#btn_oldnavy:hover {
				background-color: #fff;
				border: 3px dashed #003764;
				color: #003764;
				text-shadow: none;
			}

			a#btn_fitbit {
				display: block;
				width: 130px;
				height: 130px;
				box-sizing: border-box;
				border: 10px solid #00b0b9;
				border-radius: 65px;
				margin: auto;
				margin-top: 65px;
				padding-top: 22px;
				background-color: #fff;
				color: #2b3a4a;
				font-family: 'Nunito', sans-serif;
				font-size: 26px;
				text-decoration: none;
				transition: all .3s;
			}

			a#btn_fitbit i {
				display: block;
				color: #00b0b9;
				font-size: 32px;
			}

			a#btn_fitbit:hover {
				background-color: #00b0b9;
				color: #fff;
			}

			a#btn_fitbit:hover i {
				color: #fff;
			}


		</style>
	</head>
	<body>
		
		<main>

			<h1>Button Styling - Prajwal Adhikari</h1>
			
			<div class="button_container">
				<a href="https://www.instagram.com/" target="_blank" id="btn_instagram"><i class="fa fa-instagram"></i>Instagram</a>
			</div>

			<div class="button_container">
				<a href="http://www.cartoonnetwork.com/" target="_blank" id="btn_cartoon">Cartoon Network</a>
			</div>

			<div class="button_container">
				<a href="http://www.ibm.com/" target="_blank" id="btn_ibm">IBM</a>
			</div>

			<div class="button_container">
				<a href="http://www.oldnavy.com/" target="_blank" id="btn_oldnavy"><i class="fa fa-star"></i>Old Navy</a>
			</div>

			<div class="button_container">
				<a href="http://www.fitbit.com/home" target="_blank" id="btn_fitbit"><i class="fa fa-heart"></i>fitbit</a>
			</div>

		</main>	

	</body>
</html>
